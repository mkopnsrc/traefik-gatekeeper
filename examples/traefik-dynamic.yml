# Example traefik dynamic configuration (file provider). Placeholders only.
http:
  routers:
    # The protected site: only addresses in the allowlist get through.
    app:
      entryPoints: [websecure]
      rule: "Host(`app.example.com`)"
      middlewares: [gatekeeper-allowlist@file]
      service: app
      tls: {}

    # The request page on the same host. Higher priority than "app", and it
    # must NOT use the allowlist middleware (visitors aren't allowed yet).
    app-gatekeeper:
      entryPoints: [websecure]
      rule: "Host(`app.example.com`) && PathPrefix(`/routemein`)"
      priority: 1000
      service: gatekeeper
      tls: {}

  services:
    app:
      loadBalancer:
        servers:
          - url: "http://app:8080"
    gatekeeper:
      loadBalancer:
        servers:
          - url: "http://traefik-gatekeeper:5000"

# The middleware "gatekeeper-allowlist" itself is generated by traefik-gatekeeper
# in gatekeeper-allowlist.yml (same directory). Don't define it here.
